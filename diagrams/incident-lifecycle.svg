<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Synthetic healthy, newly failing, unchanged, reminded, changed, and recovered observations">
<rect width="1200" height="340" fill="#f7f9fc"/><text x="55" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#12233d">Incident lifecycle · deterministic example</text><text x="55" y="87" font-family="Arial, sans-serif" font-size="15" fill="#4b617c">Six-hour reminders follow the last queued event for this target</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#507099"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="53" y="140" width="160" height="89" rx="13" fill="#e7f5ea" stroke="#8bbb98"/><text x="133" y="175" font-size="18" font-weight="700" fill="#1d6035">Healthy</text><text x="133" y="201" font-size="14" fill="#32694a">No event</text>
<rect x="245" y="140" width="160" height="89" rx="13" fill="#ffedf0" stroke="#df9ead"/><text x="325" y="175" font-size="18" font-weight="700" fill="#822b40">New failure</text><text x="325" y="201" font-size="14" fill="#823d50">Notify</text>
<rect x="437" y="140" width="160" height="89" rx="13" fill="#eff3f8" stroke="#9eacc5"/><text x="517" y="175" font-size="18" font-weight="700" fill="#334e70">Persistent</text><text x="517" y="201" font-size="14" fill="#536985">Suppress / remind</text>
<rect x="629" y="140" width="160" height="89" rx="13" fill="#fff1da" stroke="#d6ae6a"/><text x="709" y="175" font-size="18" font-weight="700" fill="#745221">Changed</text><text x="709" y="201" font-size="14" fill="#856a43">Notify new fault</text>
<rect x="821" y="140" width="160" height="89" rx="13" fill="#e7f5ea" stroke="#8bbb98"/><text x="901" y="175" font-size="18" font-weight="700" fill="#1d6035">Closed</text><text x="901" y="201" font-size="14" fill="#32694a">Recover / retire</text>
</g><g fill="none" stroke="#507099" stroke-width="3" marker-end="url(#a)"><path d="M213 185 H245"/><path d="M405 185 H437"/><path d="M597 185 H629"/><path d="M789 185 H821"/></g>
<text x="55" y="290" font-size="14" font-family="Arial, sans-serif" fill="#60718a">Verified health recovers; removed targets retire; prolonged unknowns trigger separate verification-gap alerts.</text></svg>