</g><text x="79" y="511" fill="#61748f" font-family="Arial, sans-serif" font-size="13">Pending events are persisted before stdout and acknowledged after a successful flush.</text><text x="79" y="534" fill="#61748f" font-family="Arial, sans-serif" font-size="13">Batch size: 128 · Stable delivery IDs · Backpressure preserves unevaluated transitions for retry · Independent flush mode</text></svg>