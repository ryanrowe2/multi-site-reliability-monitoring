name: PHP offline demo CI
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
      - name: Configure pinned YAML scanner in isolated Python environment
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cmm-security"
          "$RUNNER_TEMP/cmm-security/bin/pip" install --disable-pip-version-check -r requirements-security.txt
          echo "$RUNNER_TEMP/cmm-security/bin" >> "$GITHUB_PATH"
      - name: Composer metadata validation
        run: composer validate --strict
      - name: Install static analysis dependency
        run: composer install --no-interaction --prefer-dist
      - name: PHPStan static analysis
        run: composer analyse
      - name: PHP syntax checks
        run: php tools/lint.php
      - name: Offline tests
        run: php -d xdebug.mode=coverage tests/run.php --coverage
      - name: Validate static SVG XML
        run: php tools/validate_svg.php
      - name: Working-tree publication scan
        run: php tools/publication_scan.php
      - name: Strict scan of the exact tracked release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/monitor-release"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/monitor-release"
          php tools/publication_scan.php --release "$RUNNER_TEMP/monitor-release"
          (
            cd "$RUNNER_TEMP/monitor-release"
            sha256sum -c MANIFEST.sha256
          )
          php tools/verify_manifest.php "$RUNNER_TEMP/monitor-release"
